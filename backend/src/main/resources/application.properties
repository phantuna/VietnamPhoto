spring.datasource.url=jdbc:mysql://localhost:3306/VNScount
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=8081
jwt.signerKey=DEVTERIA_SUPER_SECRET_KEY_2024_512_BIT
logging.level.org.springframework.security=DEBUG

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key= ${CLOUD_API_KEY}
cloudinary.api-secret:${CLOUD_API_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

vietmap.api-key=${VIETMAP_API_KEY}
vietmap.base-url=https://maps.vietmap.vn/api
vietmap.reverse-display-type=6
vietmap.search-display-type=5